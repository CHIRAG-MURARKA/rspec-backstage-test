            examples:
              post_#recache_only_coupon_codes_with_valid_params_queues_the_coupon::couponcodecachingworker:
                summary: 'POST #recache_only_coupon_codes with valid params queues
                  the Coupon::CouponCodeCachingWorker'
                value:
                  coupon_template_ids:
                  - 1
                  - 2
                  - 3
              post_#recache_only_coupon_codes_with_invalid_params_returns_a_bad_request_error:
                summary: 'POST #recache_only_coupon_codes with invalid params returns
                  a bad request error'
                value: {}
      responses:
        '200':
          description: queues the Coupon::CouponCodeCachingWorker
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
