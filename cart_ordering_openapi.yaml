  "/call_center/webhook/recache_coupons":
    post:
      summary: recache_coupons
      tags:
      - CallCenterApi::V1::Webhook
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                coupon_template_ids:
                  type: array
                  items:
                    type: integer
              required:
              - coupon_template_ids
            examples:
              post_#recache_coupons_with_valid_params_queues_the_coupon::couponcachingworker:
                summary: 'POST #recache_coupons with valid params queues the Coupon::CouponCachingWorker'
                value:
                  coupon_template_ids:
                  - 1
                  - 2
                  - 3
              post_#recache_coupons_with_invalid_params_returns_a_bad_request_error:
                summary: 'POST #recache_coupons with invalid params returns a bad
                  request error'
                value:
                  coupon_template_ids:
              post_#recache_coupons_when_duplicate_request_is_made_returns_a_duplicate_request_error:
                summary: 'POST #recache_coupons when duplicate request is made returns
                  a duplicate request error'
                value:
                  coupon_template_ids:
                  - 1
                  - 2
                  - 3
      responses:
        '200':
          description: queues the Coupon::CouponCachingWorker
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      code:
                        type: integer
                      status:
                        type: string
                      message:
                        type: string
                      error:
                        type: boolean
                      version:
                        type: string
                      copyright:
                        type: string
                    required:
                    - code
                    - status
                    - message
                    - error
                    - version
                    - copyright
                required:
                - meta
              examples:
                post_#recache_coupons_with_valid_params_queues_the_coupon::couponcachingworker:
                  summary: 'POST #recache_coupons with valid params queues the Coupon::CouponCachingWorker'
                  value:
                    meta:
                      code: 200
                      status: OK
                      message: Request queued for processing. Mail will be sent on
                        technology@box8.in, kd@box8.in, dsl@box8.in once completed.
                        Note this api now only cache offer,coupon_template & outlet
                        coupons.Ask developer if you need to cache Coupon Codes.
                      error: false
                      version: '1.0'
                      copyright: Copyright 2015 Box8
        '400':
          description: returns a duplicate request error
          content:
            application/json:
              schema: {}
              examples:
                post_#recache_coupons_with_invalid_params_returns_a_bad_request_error:
                  summary: 'POST #recache_coupons with invalid params returns a bad
                    request error'
                  value:
                    meta:
                      code: 400
                      status: Not OK
                      message: Bad Request. Check Parameters. Ask developer for request
                        params format.
                      error: true
                      version: '1.0'
                      copyright: Copyright 2015 Box8
                post_#recache_coupons_when_duplicate_request_is_made_returns_a_duplicate_request_error:
                  summary: 'POST #recache_coupons when duplicate request is made returns
                    a duplicate request error'
                  value:
                    meta:
                      code: 400
                      status: Not OK
                      message: Dublicate Request. Worker Already Queued for these
                        parameters
                      error: true
                      version: '1.0'
                      copyright: Copyright 2015 Box8
